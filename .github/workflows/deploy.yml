name: Verify and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least privilege by default. The elevated Pages permissions are granted ONLY to the deploy job,
# which runs no third-party code — the build job runs `npm ci` (arbitrary package lifecycle
# scripts) and therefore must not hold a token that can publish to the live site.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, type-check and unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # Type-checking is a separate, named step. It previously happened implicitly inside the
      # build, under a step labelled "Type check, lint and test" that ran neither.
      - name: Type check
        run: npx tsc -b

      - name: Unit and property tests
        run: npm run test

  e2e:
    name: End-to-end acceptance journeys
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      # BUS-108 requires the primary human-decision journeys to be covered by Playwright against
      # a production build. That requirement was previously asserted in the docs but never
      # enforced here, so the suite could rot without the pipeline noticing.
      - name: Run acceptance journeys
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  build:
    name: Build static site
    runs-on: ubuntu-latest
    needs: [verify, e2e]
    if: github.event_name != 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Determine base path
        id: base_path
        # The repository name is passed through the environment rather than interpolated directly
        # into the shell. GitHub repository names cannot contain shell metacharacters, so this is
        # hygiene rather than a live vulnerability — but it is the pattern that gets copied into
        # places where it IS dangerous.
        env:
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          # A user/organisation page repo (named <owner>.github.io) is served from '/'.
          # Any other (project) repo is served from '/<repo-name>/'.
          if [[ "$REPO_NAME" == *.github.io ]]; then
            echo "value=/" >> "$GITHUB_OUTPUT"
          else
            echo "value=/$REPO_NAME/" >> "$GITHUB_OUTPUT"
          fi

      # This is the actual lesson from the "Pages silently served a stale build for three commits"
      # incident: `needs: [verify, e2e]` failing upstream left no visible signal on the site itself
      # that a deployment had stopped happening. Stamping the commit and build time into the built
      # site means the live site can always be checked against `git log` rather than trusted blind.
      - name: Determine build metadata
        id: build_meta
        env:
          FULL_SHA: ${{ github.sha }}
        run: |
          echo "short_sha=${FULL_SHA:0:7}" >> "$GITHUB_OUTPUT"
          echo "build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build
        env:
          VITE_BASE_PATH: ${{ steps.base_path.outputs.value }}
          VITE_BUILD_SHA: ${{ steps.build_meta.outputs.short_sha }}
          VITE_BUILD_TIME: ${{ steps.build_meta.outputs.build_time }}
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    # Elevated permissions scoped to this job only.
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
